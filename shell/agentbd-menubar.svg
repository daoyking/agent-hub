<!--
  agentbd 菜单栏图标（template image）。

  菜单栏图标必须满足：
  1. 单色黑（macOS 按深浅色菜单栏自动反相；带颜色会被系统忽略 alpha）
  2. 透明底（不是白底方块）
  3. 留 1~2pt 边距，18x18 pt @1x / 36x36 @2x

  造型：一条竖"总线" + 四个外围节点——对应 agentbd 的核心概念（多个 agent
  由一个总线汇聚）。比纯色圆点更有辨识度，也不会像文字 "● agentbd" 那样在
  菜单栏里占太宽（菜单栏宽度有限，文字太宽会挤压其它状态项）。

  build.sh 会转成 @1x/@2x 的 template PNG 并设为 NSStatusItem 的 image。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
  <g stroke="#000000" stroke-width="1.5" stroke-linecap="round" fill="none">
    <line x1="9" y1="4.5" x2="9" y2="13.5"/>
    <line x1="9" y1="9" x2="3.4" y2="6"/>
    <line x1="9" y1="9" x2="14.6" y2="6"/>
    <line x1="9" y1="9" x2="3.4" y2="12"/>
    <line x1="9" y1="9" x2="14.6" y2="12"/>
  </g>
  <g fill="#000000">
    <circle cx="9" cy="9" r="2.2"/>
    <circle cx="3.4" cy="6" r="1.7"/>
    <circle cx="14.6" cy="6" r="1.7"/>
    <circle cx="3.4" cy="12" r="1.7"/>
    <circle cx="14.6" cy="12" r="1.7"/>
  </g>
</svg>
