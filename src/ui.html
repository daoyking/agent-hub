<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>agentbd 面板</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --fg:#e6e9ef; --dim:#8b93a3; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system,"SF Pro Text",sans-serif; height:100vh; display:flex; overflow:hidden; }
  /* ① 只有左栏滚动：body 固定高不滚，左栏自滚，右侧对话区固定铺满 */
  aside { width:320px; flex:none; border-right:1px solid var(--line); padding:16px; overflow-y:auto; height:100vh; }
  main { flex:1; display:flex; flex-direction:column; padding:16px; gap:12px; height:100vh; overflow:hidden; }
  h1 { font-size:16px; margin:0 0 12px; } h2 { font-size:12px; color:var(--dim); margin:18px 0 6px; text-transform:uppercase; letter-spacing:.08em; }
  .lamp { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }
  .green{background:#3fb950}.red{background:#f85149}.amber{background:#d29922}.unknown{background:#6e7681}
  .row { padding:6px 8px; border-radius:6px; display:flex; align-items:center; gap:4px; }
  .row:hover { background:var(--panel); }
  .row small { color:var(--dim); margin-left:auto; font-size:11px; }
  em.undecl { font-style:normal; font-size:10px; color:#d29922; border:1px solid #3a3020; border-radius:4px; padding:0 4px; margin-right:6px; }
  .mcp-target { color:var(--dim); font-size:11px; word-break:break-all; }

  /* ── 左栏：筛选 + 可折叠分组（服务变多后 44 条平铺太长）── */
  #filters { display:flex; gap:6px; margin-bottom:10px; position:sticky; top:-16px; background:var(--bg); padding:16px 0 8px; z-index:5; }
  #q { flex:1; min-width:0; padding:5px 8px; font-size:12.5px; }
  #onlyUndecl { flex:none; font-size:11px; color:var(--dim); display:flex; align-items:center; gap:3px; white-space:nowrap; cursor:pointer; user-select:none; }
  section.grp { margin-top:10px; }
  section.grp > summary {
    cursor:pointer; list-style:none; user-select:none;
    font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em;
    display:flex; align-items:center; gap:5px; padding:4px 0;
  }
  section.grp > summary::-webkit-details-marker { display:none; }
  section.grp > summary::before { content:'▸'; font-size:10px; transition:transform .12s; }
  section.grp[open] > summary::before { transform:rotate(90deg); }
  section.grp > summary .cnt { margin-left:auto; text-transform:none; letter-spacing:0; font-size:11px; }
  .grp-body { padding-left:2px; }
  .row.total { opacity:.6; border-top:1px solid var(--line); margin-top:4px; padding-top:6px; }
  .row mark { background:#3a2f10; color:#f0d78c; border-radius:3px; padding:0 1px; }
  /* ② 顶栏：状态 + 引擎选择；对话区居中伸展，输入框常驻底部 */
  #topbar { display:flex; flex-direction:column; gap:8px; }
  .topbar-row { display:flex; align-items:center; gap:8px; }
  .topbar-row .chk { display:flex; align-items:center; gap:4px; color:var(--dim); font-size:12px; white-space:nowrap; }
  #status { color:var(--dim); font-size:12px; margin-left:auto; }
  #resume { flex:1; min-width:0; }
  #composer { display:flex; gap:8px; align-items:flex-end; }
  #composer button { flex:none; height:64px; padding:0 22px; }
  input,select,button,textarea { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; }
  textarea { flex:1; min-height:64px; max-height:220px; resize:vertical; }
  button { cursor:pointer; } button:hover { border-color:#3d4454; }
  #events { flex:1; min-height:0; overflow-y:auto; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; font-family:ui-monospace,Menlo,monospace; font-size:12.5px; white-space:pre-wrap; word-break:break-word; }
  .delta{color:#e6e9ef}.thought{color:#8b93a3}.tool{color:#58a6ff}.err{color:#f85149}.ok{color:#3fb950}.sys{color:#d29922}
  .appr { border:1px solid #d29922; background:#1d1a10; border-radius:8px; padding:8px 10px; margin:6px 0; }
  .appr .appr-title { color:var(--dim); font-size:12px; margin:3px 0; word-break:break-all; }
  .appr .appr-input { color:var(--dim); font-size:11px; word-break:break-all; }
  .appr .appr-btns { display:flex; gap:8px; margin-top:6px; }
  .appr button { padding:4px 14px; }
  .appr button.allow { border-color:#3fb950; color:#3fb950; }
  .appr button.deny { border-color:#f85149; color:#f85149; }
  .appr button:disabled { opacity:.4; cursor:default; }
  #status { color:var(--dim); font-size:12px; }
  .term { background:#0b0d11; border:1px solid var(--line); border-radius:8px; margin:6px 0; }
  .term .term-head { color:#d29922; padding:4px 8px; border-bottom:1px solid var(--line); font-size:11.5px; }
  .term .term-out { padding:6px 8px; max-height:240px; overflow-y:auto; white-space:pre-wrap; word-break:break-all; color:#c9d1d9; }
  .term .term-exit { color:var(--dim); padding:2px 8px 6px; font-size:11px; }
  .diff { border:1px solid var(--line); border-radius:8px; margin:6px 0; overflow:hidden; }
  .diff .diff-head { color:#c678dd; padding:4px 8px; background:#1a1520; font-size:11.5px; }
  .diff .diff-body { padding:4px 8px; max-height:260px; overflow:auto; white-space:pre-wrap; word-break:break-all; }
  .diff .del { color:#f85149; display:block; } .diff .add { color:#3fb950; display:block; } .diff .ctx { color:var(--dim); display:block; }
  #planbox { border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin:6px 0; background:#141824; }
  #planbox .plan-title { color:#c678dd; font-size:11.5px; margin-bottom:4px; }
  #planbox .doing { color:#d29922; } #planbox .done { color:#3fb950; } #planbox .pending { color:var(--dim); }
</style>
</head>
<body>
<aside>
  <h1>agentbd 面板</h1>
  <div id="filters">
    <input id="q" type="search" placeholder="筛选引擎 / 服务 / MCP…" autocomplete="off">
    <label id="onlyUndecl" title="只看未登记进 services.json 的服务"><input type="checkbox">未登记</label>
  </div>
  <section class="grp" id="g-engines" open><summary>引擎 <span class="cnt" id="c-engines"></span></summary><div class="grp-body" id="engines"></div></section>
  <section class="grp" id="g-svc-ok" open><summary>本地服务 · 已登记 <span class="cnt" id="c-svc-ok"></span></summary><div class="grp-body" id="services-ok"></div></section>
  <section class="grp" id="g-svc-new"><summary>本地服务 · 现场发现 <span class="cnt" id="c-svc-new"></span></summary><div class="grp-body" id="services-new"></div></section>
  <section class="grp" id="g-mcp" open><summary>MCP Hub <span class="cnt" id="c-mcp"></span></summary><div class="grp-body" id="mcp"></div></section>
  <section class="grp" id="g-stats" open><summary>用量 <span class="cnt" id="c-stats"></span></summary><div class="grp-body" id="stats"></div></section>
</aside>
<main>
  <div id="topbar">
    <div class="topbar-row">
      <strong>对话</strong>
      <span id="status">连接中…</span>
    </div>
    <div class="topbar-row">
      <select id="engine" title="引擎"></select>
      <select id="approval" title="审批策略">
        <option value="guard">guard</option><option value="auto">auto</option><option value="deny">deny</option>
      </select>
      <label class="chk"><input type="checkbox" id="withMcp"> MCP</label>
      <input id="resume" placeholder="续接 last / session id" title="续接已有会话">
    </div>
  </div>
  <div id="events"></div>
  <div id="composer">
    <textarea id="prompt" placeholder="输入 prompt，Enter 发送（Shift+Enter 换行）"></textarea>
    <button id="send">发送</button>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const lamp = (c) => `<span class="lamp ${c||'unknown'}"></span>`;
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
/** 关键词高亮（在已 escape 的文本上做，<mark> 是我们自己加的） */
function hl(s, q) {
  const t = esc(s);
  if (!q) return t;
  const i = t.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return t;
  return t.slice(0, i) + '<mark>' + t.slice(i, i + q.length) + '</mark>' + t.slice(i + q.length);
}
const filters = () => ({
  q: $('q').value.trim().toLowerCase(),
  onlyUndecl: $('onlyUndecl').querySelector('input').checked,
});
const hit = (text, f) => !f.q || String(text).toLowerCase().includes(f.q);
const setCount = (id, n, shown) => {
  const el = $(id);
  el.textContent = (shown != null && shown !== n) ? `${shown}/${n}` : String(n);
};
function log(cls, text) {
  const div = document.createElement('div');
  div.className = cls; div.textContent = text;
  $('events').appendChild(div); $('events').scrollTop = $('events').scrollHeight;
}
let lastState = null; // 筛选变化时本地重渲染，不必重新 fetch
let lastStats = null;
async function refresh() {
  try {
    const s = await (await fetch('/api/state')).json();
    lastState = s;
    $('status').textContent = `更新于 ${new Date(s.at).toLocaleTimeString()}`;
    const sel = $('engine');
    if (sel.options.length !== s.engines.length) {
      sel.innerHTML = s.engines.map((e) => `<option value="${e.id}">${esc(e.id)}</option>`).join('');
    }
    try {
      const st = await (await fetch('/api/stats')).json();
      lastStats = st;
    } catch { lastStats = null; }
    renderSide();
  } catch (e) { $('status').textContent = '连接失败: ' + e; }
}

function renderSide() {
  const s = lastState;
  if (!s) return;
  const f = filters();

  // —— 引擎 ——
  const engines = s.engines.filter((e) => hit(`${e.id} ${e.label} ${e.vendor}`, f));
  $('engines').innerHTML = engines.map((e) =>
    `<div class="row" title="${esc(e.label)} · ${e.channel}">${lamp('green')}${hl(e.id, f.q)}<small>${esc(e.vendor)}</small></div>`).join('') || '<div class="row">(无匹配)</div>';
  setCount('c-engines', s.engines.length, engines.length);

  // —— 本地服务：已登记 / 现场发现分组（44 条平铺太长）——
  const svcRow = (x) => {
    const label = x.label || x.id;
    return `<div class="row" title="${esc(x.detail)}${x.declared ? '' : '\n未登记进 services.json（agentbd services init 可纳管）'}">` +
      `${lamp(x.lamp)}${hl(label, f.q)}` +
      `${x.declared ? '' : '<em class="undecl" title="未纳管">未登记</em>'}` +
      `<small>${esc(x.id.startsWith('pid-') ? '' : x.id)}${x.ports.map(p=>':'+p).join(' ')}</small></div>`;
  };
  const keep = (x) => (!f.onlyUndecl || !x.declared) && hit(`${x.label || x.id} ${x.id} ${x.detail} ${x.ports.join(' ')}`, f);
  const declared = s.services.filter(keep);
  const fresh = s.services.filter((x) => !x.declared && keep(x));
  $('services-ok').innerHTML = declared.map(svcRow).join('') || '<div class="row">(无匹配)</div>';
  $('services-new').innerHTML = fresh.map(svcRow).join('') || '<div class="row">(无匹配)</div>';
  const nDec = s.services.filter((x) => x.declared).length;
  setCount('c-svc-ok', nDec, declared.length);
  setCount('c-svc-new', s.services.length - nDec, fresh.length);

  // —— MCP ——
  const mcps = s.mcp.filter((m) => hit(`${m.name} ${m.target}`, f));
  $('mcp').innerHTML = mcps.map((m) =>
    `<div class="row" title="${esc(m.target)}">${lamp(m.serviceLamp || (m.serviceId ? 'unknown' : 'green'))}${hl(m.name, f.q)}<small>${m.agents.length} agent</small><div class="mcp-target">${esc(m.target)}</div></div>`).join('') || '<div class="row">(无匹配)</div>';
  setCount('c-mcp', s.mcp.length, mcps.length);

  // —— 用量 ——
  const st = lastStats;
  if (!st) { $('stats').innerHTML = '<div class="row">(未取到)</div>'; $('c-stats').textContent = ''; return; }
  const rows = (st.byEngine || []).filter((r) => hit(r.engine, f)).map((r) =>
    `<div class="row">${lamp('green')}${hl(r.engine, f.q)}<small>${r.turns} 轮 · ${r.tokens} tok · $${Number(r.costUsd).toFixed(4)}</small></div>`);
  const b = st.budget;
  if (b && b.limits) {
    const parts = [];
    if (b.limits.dailyTokens) parts.push(`今日 ${b.today.tokens}/${b.limits.dailyTokens} tok`);
    if (b.limits.dailyUsd) parts.push(`今日 $${b.today.costUsd.toFixed(3)}/$${b.limits.dailyUsd}`);
    if (b.limits.monthlyTokens) parts.push(`本月 ${b.month.tokens}/${b.limits.monthlyTokens} tok`);
    if (b.limits.monthlyUsd) parts.push(`本月 $${b.month.costUsd.toFixed(2)}/$${b.limits.monthlyUsd}`);
    if (parts.length) {
      const over = (b.exceeded || []).length > 0;
      rows.unshift(`<div class="row">${lamp(over ? 'red' : 'green')}预算` +
        `<small${over ? ' style="color:#f85149"' : ''}>${esc(parts.join(' · '))}${over ? ' ⚠ 超限（ask 已拦截）' : ''}</small></div>`);
    }
  }
  if (st.total) rows.push(`<div class="row"><small>共 ${st.total.turns} 轮 · ${st.total.tokens} tok · $${Number(st.total.costUsd).toFixed(4)}</small></div>`);
  $('stats').innerHTML = rows.join('') || '<div class="row">(无匹配)</div>';
  setCount('c-stats', (st.byEngine || []).length);
}
const es = new EventSource('/events');
es.onmessage = (m) => {
  const p = JSON.parse(m.data);
  if (p.k === 'ping' || p.k === 'hello') return;
  if (p.k === 'state') { refresh(); return; }
  if (p.k === 'notice') { log('sys', '◆ ' + p.text); return; }
  if (p.k === 'ask.error') { log('err', '✘ ' + p.error); return; }
  if (p.k === 'approval.request') {
    const d = document.createElement('div');
    d.className = 'appr'; d.id = 'appr-' + p.id;
    d.innerHTML = `<b>⚠ ${esc(p.req.risk)} 风险审批</b> · ${esc(p.req.tool)} (${esc(p.req.kind)})` +
      `<div class="appr-title">${esc(p.req.title || '')}</div>` +
      `<div class="appr-input">${esc(JSON.stringify(p.req.rawInput ?? {}).slice(0, 300))}</div>` +
      `<div class="appr-btns"><button class="allow">允许</button><button class="deny">拒绝</button></div>`;
    $('events').appendChild(d); $('events').scrollTop = $('events').scrollHeight;
    const decide = async (allow) => {
      d.querySelectorAll('button').forEach((b) => b.disabled = true);
      try { await fetch('/api/approve', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id: p.id, allow }) }); }
      catch (e) { log('err', '审批提交失败: ' + e); }
    };
    d.querySelector('.allow').onclick = () => decide(true);
    d.querySelector('.deny').onclick = () => decide(false);
    return;
  }
  if (p.k === 'approval.decided') { const el = $('appr-' + p.id); if (el) el.remove(); log(p.allow ? 'ok' : 'err', p.allow ? '✔ 审批通过' : '✘ 审批拒绝'); return; }
  if (p.k === 'approval.timeout') { const el = $('appr-' + p.id); if (el) el.remove(); log('err', '✘ 审批超时（2 分钟未响应，已拒绝）'); return; }
  if (p.k === 'ask.done') {
    log('ok', `── stop=${p.result.stopReason} · ${p.result.durationMs}ms · session=${p.result.sessionId}`);
    return;
  }
  if (p.k !== 'ask.event') return;
  const ev = p.ev;
  if (ev.k === 'msg.delta') { let d=$('events').lastChild; if(!d||!d.dataset||!d.dataset.live){d=document.createElement('div');d.className='delta';d.dataset.live='1';$('events').appendChild(d);} d.textContent+=ev.text; $('events').scrollTop=$('events').scrollHeight; }
  else if (ev.k === 'thought.delta') log('thought', ev.text);
  else if (ev.k === 'tool.call') { log('tool', `▸ ${ev.name} ${ev.title}`); (ev.diffs||[]).forEach(renderDiff); }
  else if (ev.k === 'tool.result') { log(ev.ok ? 'ok' : 'err', `✔ ${ev.id} ${ev.ok ? 'ok' : 'failed'}`); (ev.diffs||[]).forEach(renderDiff); }
  else if (ev.k === 'plan') renderPlan(ev.steps);
  else if (ev.k === 'terminal.create') {
    const d = document.createElement('div');
    d.className = 'term'; d.id = 'term-' + ev.id;
    d.innerHTML = `<div class="term-head">$ ${esc(ev.command + ' ' + ev.args.join(' '))} <span style="color:var(--dim)">· ${esc(ev.cwd || '')}</span></div><div class="term-out"></div>`;
    $('events').appendChild(d); $('events').scrollTop = $('events').scrollHeight;
  }
  else if (ev.k === 'terminal.output') {
    const t = $('term-' + ev.id); if (!t) return;
    const out = t.querySelector('.term-out');
    out.textContent += ev.chunk;
    if (out.textContent.length > 60000) out.textContent = '…（前部截断）\n' + out.textContent.slice(-50000);
    out.scrollTop = out.scrollHeight; $('events').scrollTop = $('events').scrollHeight;
  }
  else if (ev.k === 'terminal.exit') {
    const t = $('term-' + ev.id); if (!t) return;
    const e = document.createElement('div');
    e.className = 'term-exit';
    e.textContent = `[退出 code=${ev.exitCode ?? '-'}${ev.signal ? ' signal=' + ev.signal : ''}]`;
    t.appendChild(e);
  }
  else if (ev.k === 'notice') log('sys', '◆ ' + ev.text);
  else if (ev.k === 'usage') log('thought', `用量 ${ev.used}/${ev.size} tokens`);
};
/** 计划时间线：反复更新同一个卡片，最新状态一眼可见 */
function renderPlan(steps) {
  let box = $('planbox');
  if (!box) {
    box = document.createElement('div'); box.id = 'planbox';
    $('events').appendChild(box);
  }
  const icon = { done: '✔', doing: '▶', pending: '·' };
  box.innerHTML = '<div class="plan-title">📋 计划</div>' + steps.map((s) =>
    `<div class="${s.status}">${icon[s.status] || '·'} ${esc(s.title)}</div>`).join('');
  $('events').scrollTop = $('events').scrollHeight;
}
/** 文件改动卡片：前缀/后缀裁剪的行级微 diff，只展示真正变化的行 */
function renderDiff(d) {
  const oldL = (d.oldText ?? '').split('\n'), newL = d.newText.split('\n');
  let pre = 0;
  while (pre < oldL.length && pre < newL.length && oldL[pre] === newL[pre]) pre++;
  let suf = 0;
  while (suf < oldL.length - pre && suf < newL.length - pre && oldL[oldL.length - 1 - suf] === newL[newL.length - 1 - suf]) suf++;
  const del = oldL.slice(pre, oldL.length - suf), add = newL.slice(pre, newL.length - suf);
  const card = document.createElement('div');
  card.className = 'diff';
  card.innerHTML = `<div class="diff-head">📝 ${esc(d.path)} <span style="color:var(--dim)">-${del.length}/+${add.length}</span></div>` +
    `<div class="diff-body">` +
    (pre > 0 ? `<span class="ctx">⋮ 上文 ${pre} 行相同</span>` : '') +
    del.map((l) => `<span class="del">- ${esc(l)}</span>`).join('') +
    add.map((l) => `<span class="add">+ ${esc(l)}</span>`).join('') +
    (suf > 0 ? `<span class="ctx">⋮ 下文 ${suf} 行相同</span>` : '') +
    `</div>`;
  $('events').appendChild(card); $('events').scrollTop = $('events').scrollHeight;
}
async function send() {
  const prompt = $('prompt').value.trim();
  if (!prompt) return;
  log('sys', `▶ ${$('engine').value}: ${prompt}`);
  $('prompt').value = '';
  const body = { engine:$('engine').value, prompt, withMcp:$('withMcp').checked, approval:$('approval').value };
  const rs = $('resume').value.trim();
  if (rs) body.resume = rs;
  await fetch('/api/ask', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
}
$('send').onclick = send;
$('prompt').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
// 筛选：输入即本地重渲染（不重新 fetch），且自动展开有命中的分组
$('q').addEventListener('input', () => {
  renderSide();
  if ($('q').value.trim()) for (const el of document.querySelectorAll('section.grp')) el.open = true;
});
$('onlyUndecl').querySelector('input').addEventListener('change', () => {
  renderSide();
  if (filters().onlyUndecl) $('g-svc-new').open = true;
});

refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
