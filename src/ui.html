<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>agentbd 面板</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --fg:#e6e9ef; --dim:#8b93a3; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system,"SF Pro Text",sans-serif; display:flex; min-height:100vh; }
  aside { width:300px; flex:none; border-right:1px solid var(--line); padding:16px; overflow-y:auto; }
  main { flex:1; display:flex; flex-direction:column; padding:16px; gap:12px; }
  h1 { font-size:16px; margin:0 0 12px; } h2 { font-size:12px; color:var(--dim); margin:18px 0 6px; text-transform:uppercase; letter-spacing:.08em; }
  .lamp { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }
  .green{background:#3fb950}.red{background:#f85149}.amber{background:#d29922}.unknown{background:#6e7681}
  .row { padding:6px 8px; border-radius:6px; display:flex; align-items:center; gap:4px; }
  .row:hover { background:var(--panel); }
  .row small { color:var(--dim); margin-left:auto; font-size:11px; }
  .mcp-target { color:var(--dim); font-size:11px; word-break:break-all; }
  #ask { display:flex; gap:8px; }
  input,select,button,textarea { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; }
  textarea { flex:1; min-height:64px; resize:vertical; }
  button { cursor:pointer; } button:hover { border-color:#3d4454; }
  #events { flex:1; overflow-y:auto; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; font-family:ui-monospace,Menlo,monospace; font-size:12.5px; white-space:pre-wrap; word-break:break-word; }
  .delta{color:#e6e9ef}.thought{color:#8b93a3}.tool{color:#58a6ff}.err{color:#f85149}.ok{color:#3fb950}.sys{color:#d29922}
  #status { color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<aside>
  <h1>agentbd 面板</h1>
  <div id="status">连接中…</div>
  <h2>引擎</h2>
  <div id="engines"></div>
  <h2>本地服务</h2>
  <div id="services"></div>
  <h2>MCP Hub</h2>
  <div id="mcp"></div>
</aside>
<main>
  <div id="ask">
    <select id="engine"></select>
    <textarea id="prompt" placeholder="输入 prompt，Enter 发送（Shift+Enter 换行）"></textarea>
    <button id="send">发送</button>
  </div>
  <div>
    <label><input type="checkbox" id="withMcp"> 注入 MCP</label>
    <select id="approval">
      <option value="guard">guard</option><option value="auto">auto</option><option value="deny">deny</option>
    </select>
  </div>
  <div id="events"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const lamp = (c) => `<span class="lamp ${c||'unknown'}"></span>`;
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function log(cls, text) {
  const div = document.createElement('div');
  div.className = cls; div.textContent = text;
  $('events').appendChild(div); $('events').scrollTop = $('events').scrollHeight;
}
async function refresh() {
  try {
    const s = await (await fetch('/api/state')).json();
    $('status').textContent = `更新于 ${new Date(s.at).toLocaleTimeString()}`;
    $('engines').innerHTML = s.engines.map((e) =>
      `<div class="row" title="${esc(e.label)} · ${e.channel}">${lamp('green')}${esc(e.id)}<small>${esc(e.vendor)}</small></div>`).join('');
    $('services').innerHTML = s.services.map((x) =>
      `<div class="row" title="${esc(x.detail)}">${lamp(x.lamp)}${esc(x.id)}<small>${x.ports.map(p=>':'+p).join(' ')}</small></div>`).join('') || '<div class="row">(无)</div>';
    $('mcp').innerHTML = s.mcp.map((m) =>
      `<div class="row" title="${esc(m.target)}">${lamp(m.serviceLamp || (m.serviceId ? 'unknown' : 'green'))}${esc(m.name)}<small>${m.agents.length} agent</small><div class="mcp-target">${esc(m.target)}</div></div>`).join('') || '<div class="row">(无)</div>';
    const sel = $('engine');
    if (sel.options.length !== s.engines.length) {
      sel.innerHTML = s.engines.map((e) => `<option value="${e.id}">${esc(e.id)}</option>`).join('');
    }
  } catch (e) { $('status').textContent = '连接失败: ' + e; }
}
const es = new EventSource('/events');
es.onmessage = (m) => {
  const p = JSON.parse(m.data);
  if (p.k === 'ping' || p.k === 'hello') return;
  if (p.k === 'state') { refresh(); return; }
  if (p.k === 'notice') { log('sys', '◆ ' + p.text); return; }
  if (p.k === 'ask.error') { log('err', '✘ ' + p.error); return; }
  if (p.k === 'ask.done') {
    log('ok', `── stop=${p.result.stopReason} · ${p.result.durationMs}ms · session=${p.result.sessionId}`);
    return;
  }
  if (p.k !== 'ask.event') return;
  const ev = p.ev;
  if (ev.k === 'msg.delta') { let d=$('events').lastChild; if(!d||!d.dataset||!d.dataset.live){d=document.createElement('div');d.className='delta';d.dataset.live='1';$('events').appendChild(d);} d.textContent+=ev.text; $('events').scrollTop=$('events').scrollHeight; }
  else if (ev.k === 'thought.delta') log('thought', ev.text);
  else if (ev.k === 'tool.call') log('tool', `▸ ${ev.name} ${ev.title}`);
  else if (ev.k === 'tool.result') log(ev.ok ? 'ok' : 'err', `✔ ${ev.id} ${ev.ok ? 'ok' : 'failed'}`);
  else if (ev.k === 'notice') log('sys', '◆ ' + ev.text);
  else if (ev.k === 'usage') log('thought', `用量 ${ev.used}/${ev.size} tokens`);
};
async function send() {
  const prompt = $('prompt').value.trim();
  if (!prompt) return;
  log('sys', `▶ ${$('engine').value}: ${prompt}`);
  $('prompt').value = '';
  await fetch('/api/ask', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ engine:$('engine').value, prompt, withMcp:$('withMcp').checked, approval:$('approval').value }) });
}
$('send').onclick = send;
$('prompt').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
